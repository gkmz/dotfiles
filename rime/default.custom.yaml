# Rime 全局自定义：默认方案、切换键
# 依赖：macOS 鼠须管（Squirrel）自带的 SharedSupport 方案。
#
# 中英切换说明：
# - 若你使用「系统输入法快捷键」在「ABC / 鼠须管」之间切换，可不在 Rime 里绑定 Shift。
# - 本配置禁用 Shift / Caps Lock 切换 Rime 内部西文状态，避免切回鼠须管后仍是英文。
patch:
  # 方案列表：只保留两个自有方案，避免原生 luna_pinyin 链路混入状态。
  schema_list:
    - schema: hank_pinyin_simp
    - schema: hank_pinyin_trad

  # 方案选单保留 F3，并加 Control+Shift+` 作为键盘备用。
  # 不使用裸 Control+`，避免 VSCode 等应用抢占后把“方案选单”文案留在输入框。
  switcher/hotkeys:
    - F3
    - "Control+Shift+grave"

  # 选单里列出的开关须与当前方案 switches.name 一致。
  # 不保存 ascii_mode，避免切到西文后重新回到鼠须管仍被记为英文模式。
  # 使用完整覆盖写法，避免 @+ 语法兼容差异导致补丁失效。
  switcher/fold_options: false
  switcher/abbreviate_options: false
  switcher/save_options:
    - ascii_punct
    - emoji_suggestion

  # 强制默认半角，避免日期/英文在中文输入时变成全角字符
  full_shape/reset: 0

  # 覆盖默认按键绑定，移除 Control+Shift+2 / @ 切换 ascii_mode 的规则。
  key_binder/bindings:
    - { when: composing, accept: Control+p, send: Up }
    - { when: composing, accept: Control+n, send: Down }
    - { when: composing, accept: Control+b, send: Left }
    - { when: composing, accept: Control+f, send: Right }
    - { when: composing, accept: Control+a, send: Home }
    - { when: composing, accept: Control+e, send: End }
    - { when: composing, accept: Control+d, send: Delete }
    - { when: composing, accept: Control+g, send: Escape }
    - { when: has_menu, accept: minus, send: Page_Up }
    - { when: has_menu, accept: equal, send: Page_Down }
    - { when: paging, accept: comma, send: Page_Up }
    - { when: has_menu, accept: period, send: Page_Down }

  # 不按 Shift / Caps Lock 切换 Rime 内部中英状态。
  # Caps Lock 交给 macOS 输入源切换；否则切回鼠须管时会停在 Rime 的西文模式。
  ascii_composer/good_old_caps_lock: true
  ascii_composer/switch_key/Caps_Lock: noop
  ascii_composer/switch_key/Shift_L: noop
  ascii_composer/switch_key/Shift_R: noop

  # 候选条每页候选数（可按喜好调整）
  "menu/page_size": 6
